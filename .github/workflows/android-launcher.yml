name: android-launcher

on:
  push:
    paths: ["android-launcher/**", ".github/workflows/android-launcher.yml"]
  pull_request:
    paths: ["android-launcher/**", ".github/workflows/android-launcher.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: herd-launcher-debug
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
