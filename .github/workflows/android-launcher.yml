name: android-launcher

on:
  push:
    paths: ["android-launcher/**", ".github/workflows/android-launcher.yml"]
  pull_request:
    paths: ["android-launcher/**", ".github/workflows/android-launcher.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship an Android SDK (ANDROID_HOME); add exactly what the build needs.
      - name: Install Android SDK packages
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: herd-launcher-debug
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
